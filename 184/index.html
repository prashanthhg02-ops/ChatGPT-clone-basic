<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f5f2">
    <title>Commonplace | AIML chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <a class="brand" href="#" aria-label="Commonplace home">
            <span class="brand-mark" aria-hidden="true">c</span>
            <span>commonplace</span>
          </a>
          <button class="icon-button mobile-close" id="close-sidebar" type="button" aria-label="Close sidebar">×</button>
        </div>

        <button class="new-chat" id="new-chat" type="button">
          <span aria-hidden="true">＋</span>
          <span>New conversation</span>
          <span class="shortcut">Ctrl K</span>
        </button>

        <div class="history-heading">YOUR CONVERSATIONS</div>
        <nav class="conversation-list" id="conversation-list" aria-label="Conversation history"></nav>

        <div class="sidebar-bottom">
          <div class="engine-label"><span class="engine-dot"></span><span>AIML engine</span><span class="engine-local">LOCAL</span></div>
          <div class="profile">
            <div class="avatar profile-avatar">Y</div>
            <div class="profile-copy"><strong>You</strong><span>Personal workspace</span></div>
            <span class="profile-menu" aria-hidden="true">···</span>
          </div>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <button class="icon-button menu-button" id="open-sidebar" type="button" aria-label="Open sidebar">☰</button>
          <div class="model-name"><span class="model-mark" aria-hidden="true">c</span><span>Commonplace</span><span class="model-version">AIML</span></div>
          <div class="topbar-right"><span class="ready-dot"></span><span id="engine-status">Connecting</span></div>
        </header>

        <section class="conversation" id="conversation" aria-live="polite" aria-relevant="additions text">
          <div class="welcome" id="welcome">
            <div class="welcome-kicker"><span class="kicker-line"></span> A LITTLE ROOM TO THINK <span class="kicker-line"></span></div>
            <h1>Good questions<br><span>start anywhere.</span></h1>
            <p class="welcome-copy">Pick a prompt, or bring your own.</p>
            <div class="prompt-grid">
              <button class="prompt-card" type="button" data-prompt="Tell me a joke">
                <span class="prompt-icon prompt-sun" aria-hidden="true">✳</span>
                <span><strong>Lighten the mood</strong><small>Tell me a joke</small></span>
                <span class="prompt-arrow" aria-hidden="true">↗</span>
              </button>
              <button class="prompt-card" type="button" data-prompt="What can you do?">
                <span class="prompt-icon prompt-orbit" aria-hidden="true">◉</span>
                <span><strong>Get acquainted</strong><small>What can you do?</small></span>
                <span class="prompt-arrow" aria-hidden="true">↗</span>
              </button>
              <button class="prompt-card" type="button" data-prompt="I feel a little stuck">
                <span class="prompt-icon prompt-leaf" aria-hidden="true">⌁</span>
                <span><strong>Find a starting point</strong><small>I feel a little stuck</small></span>
                <span class="prompt-arrow" aria-hidden="true">↗</span>
              </button>
              <button class="prompt-card" type="button" data-prompt="What is AIML?">
                <span class="prompt-icon prompt-spark" aria-hidden="true">✧</span>
                <span><strong>Explore an idea</strong><small>What is AIML?</small></span>
                <span class="prompt-arrow" aria-hidden="true">↗</span>
              </button>
            </div>
          </div>
          <div class="messages" id="messages"></div>
        </section>

        <footer class="composer-area">
          <form class="composer" id="chat-form">
            <textarea id="message-input" rows="1" placeholder="Ask anything" aria-label="Message Commonplace"></textarea>
            <div class="composer-tools">
              <span class="composer-hint">AIML responses · no account needed</span>
              <button class="send-button" id="send-button" type="submit" aria-label="Send message" disabled><span aria-hidden="true">↑</span></button>
            </div>
          </form>
          <p class="disclaimer">Commonplace can make mistakes. Check important information.</p>
        </footer>
      </main>
    </div>
    <div class="sidebar-scrim" id="sidebar-scrim"></div>
    <div class="toast" id="toast" role="status"></div>
  </body>
</html>
